<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
<title id="title">AIKO — mascotte</title>
<desc id="desc">Mascotte anime kawaii aux cheveux bruns, portant un hoodie bleu nuit, sur fond bleu électrique.</desc>
